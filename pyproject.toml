[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reentry"
version = "0.7.0"
description = "CCSDS Space Packet conformance and robustness-testing harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
]

[project.scripts]
reentry = "reentry.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reentry"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # test_runner_against_buggy_mock_target_detects_crash deliberately crashes a thread.
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.semantic_release]
# Version is bumped in-place here (feat: -> minor, fix: -> patch, BREAKING CHANGE: -> major).
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = ""
